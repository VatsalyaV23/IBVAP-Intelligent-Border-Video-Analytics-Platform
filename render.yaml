services:
  - type: web
    name: ibvap-backend
    env: python
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./ibvap.db
      - key: BLOCKCHAIN_MODE
        value: LOCAL_LEDGER
      - key: JWT_SECRET
        generateValue: true
